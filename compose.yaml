# GPS traces tiles on one server: PostGIS, gpxtiler (import, updates, PNG
# tiles, render) and Tilekiln (vector tiles). See README.md.
#
# Every gpxtiler flag is written in the command of its service. The values
# come from .env (see .env.example), or the default after ":-".
#
# PNG tiles:    http://localhost:${GPXTILER_PORT:-8080}/lines/{z}/{x}/{y}.png
# Vector tiles: http://localhost:${TILEKILN_PORT:-8081}/gps/tilejson.json
# Viewer:       http://localhost:${VIEWER_PORT:-8090}/
name: gpx-tiles
x-gpxtiler: &gpxtiler
  build: ${GPXTILER_SRC:-./gpxtiler}
  image: gpxtiler
  restart: unless-stopped
  environment:
    GPXTILER_DB: postgres://gpxtiler:${POSTGRES_PASSWORD:-gpxtiler}@db:5432/gpxtiler
  volumes:
    - ./data:/data   # /data/expire/png and /vector: expire files, /data/tiles: PNG tiles
  depends_on:
    db:
      condition: service_healthy

x-tilekiln-env: &tilekiln-env
  # The user goes in PGUSER: "serve live" breaks with --storage-username
  # (Tilekiln 0.8.4 passes it to psycopg as "username").
  PGUSER: gpxtiler
  PGPASSWORD: ${POSTGRES_PASSWORD:-gpxtiler}
  # STORE: where the tiles are kept. SRC: where the lines are read from.
  STORE: --config /config/config.yaml --storage-host db --storage-dbname gpxtiler
  SRC: --source-host db --source-dbname gpxtiler
x-tilekiln: &tilekiln
  build: tilekiln
  image: gpx-tiles-tilekiln
  restart: unless-stopped
  environment: *tilekiln-env
  volumes:
    - ${GPX_VECTOR_TILES_SRC:-./gpx-vector-tiles}:/config:ro
    - ./data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpxtiler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpxtiler}
      POSTGRES_DB: gpxtiler
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpxtiler"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Load the dump once: docker compose run --rm import
  # -grid-zooms: zooms with a grid table of the lines (changing it needs a
  # new import). -expire-*: the changed tiles are written to expire files,
  # the same file in two folders: one for render-expired, one for tilekiln-expired.
  import:
    <<: *gpxtiler
    restart: "no"
    command: ["import",
              "-grid-zooms", "${GPXTILER_GRID_ZOOMS:-5,8,11,14}",
              "-expire-dir", "/data/expire/png,/data/expire/vector",
              "-expire-min-zoom", "${GPXTILER_EXPIRE_MIN_ZOOM:-0}",
              "-expire-max-zoom", "${GPXTILER_EXPIRE_MAX_ZOOM:-14}",
              "${GPXTILER_DUMP:-/data/gpx-planet-2013.gpx.bz2}"]
    profiles: ["import"]

  # PNG tiles on /lines/{z}/{x}/{y}.png. A tile is read from /data/tiles,
  # or drawn and kept there up to -cache-zoom. Above that it is drawn on
  # every request.
  serve:
    <<: *gpxtiler
    command: ["serve", "-listen", ":8080",
              "-tile-dir", "/data/tiles",
              "-cache-zoom", "${GPXTILER_CACHE_ZOOM:-14}",
              "-colors", "${GPXTILER_COLORS:-64}"]
    ports:
      - "${GPXTILER_PORT:-8080}:8080"
    labels:
      traefik.enable: true
      # PNG tiles and /traces/{id} (the lines of a trace, for the viewer).
      traefik.http.routers.lines.rule: Host(`${GPX_TILES_HOST:-localhost}`) && (PathPrefix(`/lines/`) || PathPrefix(`/traces/`))
      traefik.http.routers.lines.entrypoints: websecure
      traefik.http.routers.lines.tls.certresolver: letsencrypt
      traefik.http.services.lines.loadbalancer.server.port: 8080

  # Draw all the tiles of PRERENDER_ZOOMS in advance, before opening the
  # server: docker compose run --rm render-all. They are slow to draw.
  render-all:
    <<: *gpxtiler
    restart: "no"
    command: ["render",
              "-zooms", "${GPXTILER_PRERENDER_ZOOMS:-0-9}",
              "-tile-dir", "/data/tiles",
              "-colors", "${GPXTILER_COLORS:-64}"]
    profiles: ["import"]

  # Every RENDER_EXPIRED_EVERY seconds, apply the expire files: redraw the
  # expired tiles of EXPIRED_ZOOMS, remove the expired ones above (up to
  # CACHE_ZOOM) from disk so serve draws them again.
  render-expired:
    <<: *gpxtiler
    entrypoint: ["sh", "-c"]
    command:
      - while true; do
          gpxtiler render -expired
            -zooms ${GPXTILER_EXPIRED_ZOOMS:-6-9}
            -cache-zoom ${GPXTILER_CACHE_ZOOM:-14}
            -expire-dir /data/expire/png
            -tile-dir /data/tiles
            -colors ${GPXTILER_COLORS:-64};
          sleep ${GPXTILER_RENDER_EXPIRED_EVERY:-300};
        done

  # Every RENDER_DAILY_EVERY seconds, redraw all the tiles of DAILY_ZOOMS,
  # the ones render-expired does not touch, so deleted traces leave them too.
  render-daily:
    <<: *gpxtiler
    entrypoint: ["sh", "-c"]
    command:
      - while true; do
          sleep ${GPXTILER_RENDER_DAILY_EVERY:-86400};
          gpxtiler render
            -zooms ${GPXTILER_DAILY_ZOOMS:-0-5}
            -tile-dir /data/tiles
            -colors ${GPXTILER_COLORS:-64};
        done

  # Every RSS_EVERY seconds, load the new traces from the RSS feed of
  # -site (the website, with /traces/rss). -start-id: where the first run
  # starts (see .env.example).
  update-rss:
    <<: *gpxtiler
    entrypoint: ["sh", "-c"]
    command:
      - while true; do
          gpxtiler update -rss
            -site ${GPXTILER_SITE:-https://www.openstreetmap.org}
            -start-id "${GPXTILER_RSS_START_ID:-}"
            -expire-dir /data/expire/png,/data/expire/vector
            -expire-min-zoom ${GPXTILER_EXPIRE_MIN_ZOOM:-0}
            -expire-max-zoom ${GPXTILER_EXPIRE_MAX_ZOOM:-14};
          sleep ${GPXTILER_RSS_EVERY:-300};
        done

  # Every IDS_EVERY seconds, sync with the daily list of identifiable trace
  # ids: delete the traces not in it, download the missing ones. Needs
  # GPXTILER_IDS: docker compose --profile ids up -d
  update-ids:
    <<: *gpxtiler
    entrypoint: ["sh", "-c"]
    command:
      - while true; do
          gpxtiler update -ids "${GPXTILER_IDS:-}"
            -site ${GPXTILER_SITE:-https://www.openstreetmap.org}
            -expire-dir /data/expire/png,/data/expire/vector
            -expire-min-zoom ${GPXTILER_EXPIRE_MIN_ZOOM:-0}
            -expire-max-zoom ${GPXTILER_EXPIRE_MAX_ZOOM:-14};
          sleep ${GPXTILER_IDS_EVERY:-86400};
        done
    profiles: ["ids"]

  # Vector tiles (MVT) with Tilekiln and the config of gpx-vector-tiles,
  # the same way ops runs it on vector.openstreetmap.org: the tiles are
  # kept in the database (schema tilekiln), "serve live" reads them and
  # draws the missing ones. Common flags:
  # Create the tile storage once: docker compose run --rm tilekiln-init
  tilekiln-init:
    <<: *tilekiln
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ["tilekiln storage init $$STORE"]
    profiles: ["import"]

  # Draw all the vector tiles of TILEKILN_PRERENDER_ZOOMS in advance:
  # docker compose run --rm tilekiln-zooms
  tilekiln-zooms:
    <<: *tilekiln
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ["tilekiln generate zooms $$STORE $$SRC --num-threads ${TILEKILN_THREADS:-2} --min-zoom ${TILEKILN_PRERENDER_ZOOMS_MIN:-0} --max-zoom ${TILEKILN_PRERENDER_ZOOMS_MAX:-9}"]
    profiles: ["import"]

  tilekiln:
    <<: *tilekiln
    entrypoint: ["sh", "-c"]
    command: ["tilekiln serve live $$STORE $$SRC --bind-host 0.0.0.0 --bind-port 8000 --num-threads ${TILEKILN_THREADS:-2} --base-url ${GPX_TILES_URL:-http://localhost:${TILEKILN_PORT:-8081}}"]
    ports:
      - "${TILEKILN_PORT:-8081}:8000"
    labels:
      traefik.enable: true
      traefik.http.routers.gps.rule: Host(`${GPX_TILES_HOST:-localhost}`) && PathPrefix(`/gps/`)
      traefik.http.routers.gps.entrypoints: websecure
      traefik.http.routers.gps.tls.certresolver: letsencrypt
      traefik.http.routers.gps.middlewares: compress
      traefik.http.services.gps.loadbalancer.server.port: 8000
      # Vector tiles are not compressed by Tilekiln; Traefik does it (gzip, br).
      traefik.http.middlewares.compress.compress: true

  # Every RENDER_EXPIRED_EVERY seconds, apply the expire files to the
  # stored vector tiles: draw again the ones of TILEKILN_EXPIRED_ZOOMS,
  # delete the ones above (serve live draws them on the next request).
  tilekiln-expired:
    <<: *tilekiln
    entrypoint: ["sh", "-c"]
    command:
      - while true; do
          for f in /data/expire/vector/expire-*.txt; do
            [ -e "$$f" ] || continue;
            awk -F/ -v lo=${TILEKILN_EXPIRED_ZOOMS_MIN:-6} -v hi=${TILEKILN_EXPIRED_ZOOMS_MAX:-9} '$$1 >= lo && $$1 <= hi' "$$f"
              | tilekiln generate tiles $$STORE $$SRC --num-threads ${TILEKILN_THREADS:-2} --no-progress;
            awk -F/ -v hi=${TILEKILN_EXPIRED_ZOOMS_MAX:-9} '$$1 > hi' "$$f"
              | tilekiln storage tiledelete $$STORE;
            rm -f "$$f";
          done;
          sleep ${GPXTILER_RENDER_EXPIRED_EVERY:-300};
        done

  # Every RENDER_DAILY_EVERY seconds, draw again all the vector tiles of
  # TILEKILN_DAILY_ZOOMS, the ones tilekiln-expired does not touch, and
  # drop the stored tiles above EXPIRE_MAX_ZOOM: serve live keeps every
  # tile it draws, and the expire files do not list those zooms.
  tilekiln-daily:
    <<: *tilekiln
    entrypoint: ["sh", "-c"]
    command:
      - while true; do
          sleep ${GPXTILER_RENDER_DAILY_EVERY:-86400};
          tilekiln generate zooms $$STORE $$SRC --num-threads ${TILEKILN_THREADS:-2}
            --min-zoom ${TILEKILN_DAILY_ZOOMS_MIN:-0} --max-zoom ${TILEKILN_DAILY_ZOOMS_MAX:-5};
          z=$$(( ${GPXTILER_EXPIRE_MAX_ZOOM:-14} + 1 ));
          while [ $$z -le 20 ]; do tilekiln storage delete $$STORE -z $$z; z=$$(( z + 1 )); done;
        done

  # Make data/gpx-planet-2013.gpx.bz2 from the 2013 dump (hours):
  #   docker compose run --rm convert-2013
  # Then run import: it reads that file by default.
  convert-2013:
    build: tools
    image: gpx-tiles-tools
    command: ["convert-2013.sh"]
    environment:
      GPX_2013_SRC: ${GPX_2013_SRC:-https://planet.openstreetmap.org/gps/gpx-planet-2013-04-09.tar.xz}
    volumes:
      - ./data:/data
    profiles: ["tools"]

  # A map to look at both tile sets.
  viewer:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./viewer:/usr/share/nginx/html:ro
    ports:
      - "${VIEWER_PORT:-8090}:80"
    labels:
      traefik.enable: true
      traefik.http.routers.viewer.rule: Host(`${GPX_TILES_HOST:-localhost}`)
      traefik.http.routers.viewer.entrypoints: websecure
      traefik.http.routers.viewer.tls.certresolver: letsencrypt
      traefik.http.services.viewer.loadbalancer.server.port: 80

  # On a server with a domain: HTTPS in front of the viewer, the PNG tiles
  # (/lines/) and the vector tiles (/gps/), with a Let's Encrypt certificate.
  #   docker compose --profile web up -d
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    profiles: ["web"]

volumes:
  db-data:
  letsencrypt:
