<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS traces tiles</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { background: #000; font: 13px system-ui, sans-serif; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1;
    background: #fff; padding: 6px 10px; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
  }
  #panel label { margin-right: 10px; }
  #panel a { color: #06c; }
  #panel button { margin-right: 4px; }
  #panel form { margin-top: 6px; }
  #panel input[type=number] { width: 110px; }
  #trace-info { margin-top: 4px; color: #333; }
  #trace-info .no { color: #a00; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <label><input type="radio" name="layer" value="png" checked> PNG</label>
  <label><input type="radio" name="layer" value="vector"> Vector (Tilekiln)</label>
  <button type="button" id="go-compare" title="Our PNG tiles next to gps-tile.openstreetmap.org, with the load time and size of each tile">Compare PNG with osm.org</button>
  <button type="button" id="go-vector" title="Vector tiles with a grid: size, load time, objects and points of each tile">Inspect vector tiles</button>
  <form id="trace-form" title="Draw the lines gpxtiler loaded for a trace over the tiles">
    <label>Trace id <input id="trace-id" type="number" min="1" placeholder="12504140"></label>
    <button type="submit">Show</button>
    <label><input type="checkbox" id="trace-line" checked> line</label>
    <div id="trace-info"></div>
  </form>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// Viewer for the tiles, over OSM Carto at 20 % opacity: the PNG tiles of
// gpxtiler (?png=<tile url template>) or the vector tiles of Tilekiln
// (?vt=<tilejson url>). By default, behind Traefik, /lines/ and /gps/ on
// this origin; on the dev ports, 8080 and 8081 on this host. The position
// is kept in the URL hash.
const params = new URLSearchParams(location.search);
const dev = location.port === "8090";
const host = location.protocol + "//" + location.hostname;
const tiles = params.get("png") || (dev ? host + ":8080" : location.origin) + "/lines/{z}/{x}/{y}.png";
const vectorURL = params.get("vt") || (dev ? host + ":8081" : location.origin) + "/gps/tilejson.json";

// Color of a direction a (0 = east, counterclockwise, as a turn 0-1), the
// datamaps formula: r, g, b = sin^2(pi * (-(a + 0.5) + k)) for k = 0, 1/3, 2/3.
function color(a) {
  const h = -(a + 0.5);
  const c = (k) => Math.round(255 * Math.sin(Math.PI * (h + k)) ** 2);
  return `rgb(${c(0)}, ${c(1 / 3)}, ${c(2 / 3)})`;
}
// dir is 0-31 from the traces layer: 0 = east, 8 = north, 16 = west, 24 = south.
const lineColor = ["match", ["get", "dir"]];
for (let d = 0; d < 32; d++) lineColor.push(d, color((d + 0.5) / 32));
lineColor.push("#808080");

const modes = ["walk", "bike", "vehicle", "plane", "unknown"];
const map = new maplibregl.Map({
  container: "map",
  hash: true,
  center: [0, 30],
  zoom: 3,
  maxZoom: 20,
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster", tileSize: 256, maxzoom: 19,
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        attribution: "&copy; OpenStreetMap contributors",
      },
      traces: {
        type: "raster", tileSize: 256, maxzoom: 20,
        tiles: [tiles],
        attribution: "GPS traces",
      },
      vector: { type: "vector", url: vectorURL },
    },
    layers: [
      { id: "background", type: "background", paint: { "background-color": "#000" } },
      { id: "osm", type: "raster", source: "osm", paint: { "raster-opacity": 0.2 } },
      { id: "traces", type: "raster", source: "traces" },
      // One layer per transport mode in the tile, same style for all.
      ...modes.map((mode) => ({
        id: "vector-" + mode, type: "line", source: "vector", "source-layer": mode,
        layout: { visibility: "none", "line-cap": "round", "line-join": "round" },
        paint: {
          "line-color": lineColor,
          "line-width": 1.2,
          // fade 1-10 dims long edges (GPS jumps), like datamaps -g.
          "line-opacity": ["/", ["get", "fade"], 10],
        },
      })),
    ],
  },
});
map.addControl(new maplibregl.NavigationControl(), "top-right");

// Open the compare page and the vector inspector at the same place.
// compare.html (Leaflet) reads #map=zoom/lat/lon with a whole zoom;
// vector.html (MapLibre) reads the same hash as this page.
document.getElementById("go-compare").addEventListener("click", () => {
  const c = map.getCenter();
  location.href = `compare.html#map=${Math.round(map.getZoom())}/${c.lat.toFixed(5)}/${c.lng.toFixed(5)}`;
});
document.getElementById("go-vector").addEventListener("click", () => {
  location.href = "vector.html" + location.hash;
});

document.querySelectorAll("input[name=layer]").forEach((el) => el.addEventListener("change", () => {
  const vector = el.value === "vector";
  map.setLayoutProperty("traces", "visibility", vector ? "none" : "visible");
  for (const mode of modes) {
    map.setLayoutProperty("vector-" + mode, "visibility", vector ? "visible" : "none");
  }
}));

// Show a trace: /traces/{id} of gpxtiler returns the lines it loaded as
// GeoJSON; they are drawn in white over the tiles, so you can check that
// the tiles have them too. 404: the trace is not in the database.
const traceInfo = document.getElementById("trace-info");
const traceInput = document.getElementById("trace-id");
const empty = { type: "FeatureCollection", features: [] };
map.on("load", () => {
  map.addSource("trace-gpx", { type: "geojson", data: empty });
  map.addLayer({
    id: "trace-gpx-halo", type: "line", source: "trace-gpx",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#000", "line-width": 5, "line-opacity": 0.6 },
  });
  map.addLayer({
    id: "trace-gpx", type: "line", source: "trace-gpx",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#fff", "line-width": 2 },
  });
});

function boundsOf(geometry) {
  let b = null;
  for (const part of geometry.coordinates) {
    for (const c of part) b = b ? b.extend(c) : new maplibregl.LngLatBounds(c, c);
  }
  return b;
}

async function showTrace(id) {
  traceInfo.textContent = "…";
  // osm.org has no trace page by id alone (it needs the user name), so link
  // the GPX download and iD with the trace loaded (iD asks to log in).
  const osm = `<a href="https://www.openstreetmap.org/traces/${id}/data" target="_blank">GPX</a> · <a href="https://www.openstreetmap.org/edit?gpx=${id}" target="_blank">open in iD</a>`;
  let r;
  try {
    r = await fetch(new URL(`traces/${id}`, tiles.replace("lines/{z}/{x}/{y}.png", "")));
  } catch (e) {
    traceInfo.innerHTML = `<span class="no">tile server not reachable</span>`;
    return;
  }
  if (r.status === 404) {
    map.getSource("trace-gpx").setData(empty);
    traceInfo.innerHTML = `<span class="no">${id}: not loaded</span> · ${osm}`;
    return;
  }
  const f = await r.json();
  const p = f.properties;
  const name = p.name ? ` · ${p.name}` : "";
  if (!f.geometry) {
    map.getSource("trace-gpx").setData(empty);
    traceInfo.innerHTML = `${id}${name}: loaded, no lines (one point?) · ${osm}`;
    return;
  }
  map.getSource("trace-gpx").setData(f);
  map.fitBounds(boundsOf(f.geometry), { padding: 60, maxZoom: 16, duration: 800 });
  traceInfo.innerHTML = `${id}${name}: loaded, ${p.segments} segments, ${p.points} points (white line) · ${osm}`;
}
const findTrace = showTrace;
// Hide the white line to compare with the tiles below it.
document.getElementById("trace-line").addEventListener("change", (e) => {
  for (const l of ["trace-gpx-halo", "trace-gpx"]) {
    map.setLayoutProperty(l, "visibility", e.target.checked ? "visible" : "none");
  }
});
document.getElementById("trace-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const id = traceInput.value;
  if (!id) return;
  const url = new URL(location.href);
  url.searchParams.set("trace", id);
  history.replaceState(null, "", url);
  findTrace(id);
});
const wanted = new URLSearchParams(location.search).get("trace");
if (wanted) {
  traceInput.value = wanted;
  map.once("load", () => findTrace(wanted));
}
</script>
</body>
</html>
